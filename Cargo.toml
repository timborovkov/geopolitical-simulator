[workspace]
members = ["crates/sim-core", "crates/headless", "crates/desktop"]
default-members = ["crates/headless"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# Long campaign/replay checks exercise production-like loops without dropping guards.
[profile.test.package.sim-core]
opt-level = 1
debug-assertions = true
overflow-checks = true
